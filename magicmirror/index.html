<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magic Mirror - Dil Seçimi</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: url('https://geniusmetaverse-max.github.io/geniusmetaverse/magicmirror/magicmirror.png') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Arial', 'Helvetica', sans-serif;
      color: white;
      text-align: center;
      position: relative;
    }
    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.50);
      z-index: 1;
    }
    .container {
      max-width: 600px;
      padding: 40px 20px;
      position: relative;
      z-index: 2;
    }
    h1 {
      font-size: 3rem;
      margin: 0 0 30px;
      letter-spacing: 3px;
      text-shadow: 0 4px 12px rgba(0,0,0,0.7);
      color: #ffd700;
    }
    .lang-buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 30px;
    }
    .lang-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px; /* %50 küçültülmüş */
      font-size: 0.9rem; /* %50 küçültülmüş */
      font-weight: bold;
      color: #ffd700;
      background: transparent;
      border: 2px solid #ffd700;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
    }
    .lang-btn img {
      width: 16px; /* %50 küçültülmüş */
      height: 16px;
    }
    .lang-btn:hover {
      background: rgba(255, 215, 0, 0.1);
      transform: translateY(-4px);
    }
    .footer {
      position: fixed;
      bottom: 15px;
      left: 0; right: 0;
      font-size: 0.9rem;
      opacity: 0.8;
      z-index: 2;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>MAGIC MIRROR</h1>
    
    <div class="lang-buttons">
      <a href="welcome-en.html" class="lang-btn">
        <img src="https://flagcdn.com/w20/gb.png" alt="English"> English
      </a>
      <a href="welcome-tr.html" class="lang-btn">
        <img src="https://flagcdn.com/w20/tr.png" alt="Türkçe"> Türkçe
      </a>
    </div>
  </div>

  <div class="footer">
    © 2026 Magic Mirror • All rights reserved • Powered by littleGenius Metaverse
  </div>

</body>
</html>
