<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Volexi</title>

<style>

body{
    margin:0;
    font-family:'Segoe UI',system-ui,sans-serif;

    background:
    radial-gradient(circle at center,
    #133f8f 0%,
    #08295f 35%,
    #041937 70%,
    #020b1d 100%);

    color:#fff;
    text-align:center;

    min-height:100vh;

    display:flex;
    flex-direction:column;
    align-items:center;
}

header{
    padding:60px 20px 20px;
}

.logo{
    width:220px;
    max-width:75%;

    animation:float 4s ease-in-out infinite;

    filter:drop-shadow(0 12px 25px rgba(212,175,55,.25));
}

@keyframes float{
    0%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-15px);
    }

    100%{
        transform:translateY(0);
    }
}

.content{
    max-width:800px;
    padding:0 25px;
}

.content h1{
    color:#f5d97a;
    font-size:2.5rem;
    margin-bottom:25px;
    text-shadow:0 3px 15px rgba(0,0,0,.4);
}

.content p{
    font-size:1.2rem;
    line-height:1.8;
    margin-bottom:15px;
    text-shadow:0 2px 10px rgba(0,0,0,.45);
}

.store-buttons{
    margin-top:35px;
}

.store-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:12px;

    width:220px;
    height:58px;

    text-decoration:none;
    color:#ffffff;

    font-size:1.15rem;
    font-weight:700;

    border-radius:18px;

    background:rgba(255,255,255,0.12);

    border:1px solid rgba(255,255,255,0.35);

    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);

    box-shadow:
    0 10px 25px rgba(0,0,0,.25),
    inset 0 1px 1px rgba(255,255,255,.15);

    transition:all .3s ease;
}

.store-btn:hover{
    transform:translateY(-4px);

    background:rgba(255,255,255,0.18);

    box-shadow:
    0 15px 30px rgba(0,0,0,.35),
    inset 0 1px 1px rgba(255,255,255,.2);
}

.apple-icon{
    font-size:28px;
    line-height:1;
}

footer{
    margin-top:auto;
    padding:30px 20px;

    font-size:.9rem;
    color:rgba(255,255,255,.75);
}

</style>
</head>

<body>

<header>
    <img src="Volexi_Launcher.png" alt="Volexi"content">

    <h1>Welcome to Volexi!</h1>

    <p>
        The fast-paced, tactile word puzzle game designed
        to test your vocabulary, quick thinking,
        and strategy under pressure!
    </p>

    <p>
        Race the clock, craft high-scoring words,
        and climb the global leaderboard!
    </p>

</div>

<div class="store-buttons">

    <a href="APP_STORE_LINK_HERE"
       class="store-btn"</span>
        <span>App Store</span>

    </a>

</div>

<footer>
    Volexi © 2026 • All Rights Reserved • Powered by littleGenius
</footer>

</body>
</html>
