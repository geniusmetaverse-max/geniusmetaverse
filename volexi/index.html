
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#04152f">
<meta name="description" content="Meet Volexi, the fast-paced word puzzle game.">
<title>Volexi — Word Puzzle Challenge</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    padding: 36px 20px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: "Segoe UI", system-ui, sans-serif;
    color: #f7f9ff;
    text-align: center;
    background:
        radial-gradient(
            ellipse at 50% 35%,
            rgba(27, 75, 151, .88) 0%,
            rgba(8, 41, 95, .72) 38%,
            transparent 72%
        ),
        linear-gradient(
            145deg,
            #06152e 0%,
            #04132d 48%,
            #020817 100%
        );
}

.hero {
    width: 100%;
    max-width: 860px;
    margin: auto 0;
    padding: 18px 0 44px;
    animation: enter 850ms ease-out both;
}

.brand {
    position: relative;
    display: inline-grid;
    place-items: center;
    margin: 0 auto 26px;
    isolation: isolate;
}

.brand::before {
    content: "";
    position: absolute;
    z-index: -1;
    width: 150%;
    height: 150%;
    border-radius: 50%;
    background: radial-gradient(
        circle,
        rgba(89, 157, 255, .28) 0%,
        rgba(49, 105, 205, .12) 38%,
        transparent 72%
    );
    filter: blur(12px);
    animation: glow 4.5s ease-in-out infinite;
}

.logo {
    display: block;
    width: 180px;
    max-width: 58vw;
    height: auto;
    object-fit: contain;
    filter: drop-shadow(
        0 12px 24px rgba(0, 0, 0, .28)
    );
    animation: float 4.5s ease-in-out infinite;
}

h1 {
    margin: 0 0 18px;
    font-size: clamp(2rem, 5vw, 2.8rem);
    line-height: 1.15;
    letter-spacing: -.035em;
    color: #fff;
    text-shadow: 0 4px 22px rgba(0, 0, 0, .28);
}

.intro {
    max-width: 790px;
    margin: 0 auto;
    color: #e6edfb;
    font-size: clamp(1rem, 2.5vw, 1.2rem);
    line-height: 1.75;
}

.intro + .intro {
    margin-top: 14px;
}

.store-buttons {
    margin-top: 34px;
}

.store-btn {
    min-width: 230px;
    min-height: 64px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 14px 28px;
    border: 1px solid rgba(255, 255, 255, .38);
    border-radius: 19px;
    background: linear-gradient(
        135deg,
        rgba(255, 255, 255, .17),
        rgba(255, 255, 255, .08)
    );
    box-shadow:
        0 12px 30px rgba(0, 0, 0, .24),
        inset 0 1px rgba(255, 255, 255, .15);
    color: #fff;
    font: inherit;
    font-size: 1.15rem;
    font-weight: 750;
    text-decoration: none;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    transition:
        transform 220ms ease,
        background 220ms ease,
        box-shadow 220ms ease;
}

.store-btn:hover {
    transform: translateY(-4px);
    background: rgba(255, 255, 255, .22);
    box-shadow: 0 17px 34px rgba(0, 0, 0, .32);
}

.store-btn:focus-visible {
    outline: 3px solid #f5d97a;
    outline-offset: 5px;
}

.apple-icon {
    font-size: 1.65rem;
    line-height: 1;
}

footer {
    width: 100%;
    padding: 22px 10px 26px;
    color: #c4d0e7;
    font-size: .92rem;
    line-height: 1.6;
}

@keyframes float {
    0%, 100% {
        transform: translateY(0) rotate(0deg);
    }
    50% {
        transform: translateY(-10px) rotate(-1deg);
    }
}

@keyframes glow {
    0%, 100% {
        opacity: .62;
        transform: scale(.94);
    }
    50% {
        opacity: 1;
        transform: scale(1.08);
    }
}

@keyframes enter {
    from {
        opacity: 0;
        transform: translateY(14px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media (max-width: 520px) {
    body {
        padding: 20px 18px 0;
    }

    .hero {
        padding: 24px 0 30px;
    }

    .logo {
        width: 150px;
    }

    .intro {
        line-height: 1.65;
    }

    .store-buttons {
        margin-top: 28px;
    }

    .store-btn {
        width: min(100%, 300px);
    }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
    }
}
</style>
</head>

<body>

<main class="hero">

    <div class="brand">
        <img
            class="logo"
            src="./Volexi_Launcher.png"
            alt="Volexi logo"
        >
    </div>

    <h1>Welcome to Volexi!</h1>

    <p class="intro">
        The fast-paced, tactile word puzzle game designed
        to test your vocabulary, quick thinking,
        and strategy under pressure!
    </p>

    <p class="intro">
        Race the clock, craft high-scoring words,
        and climb the global leaderboard!
    </p>

    <div class="store-buttons">
        <a
            class="store-btn"
            href="APP_STORE_LINK_HERE"
            aria-label="Download Volexi on the App Store"
        >
            <span class="apple-icon" aria-hidden="true"></span>
            <span>App Store</span>
        </a>
    </div>

</main>

<footer>
    Volexi © 2026 · All Rights Reserved · Powered by littleGenius
</footer>

</body>
</html>
