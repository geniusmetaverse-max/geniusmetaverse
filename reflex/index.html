<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RefleX - Index</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: url("reflex_onboarding.png") no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      text-align: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
    }

    header {
      text-align: center;
      padding: 60px 20px 20px;
    }

    header img.logo {
      width: 200px;
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
      100% { transform: translateY(0); }
    }

    .lang-buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 30px 0;
    }

    .lang-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 28px;
      font-size: 1.2rem;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(135deg, #ff007b, #6610f2); /* Mor tonlar */
      border: none;
      border-radius: 40px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      box-shadow: 0 6px 20px rgba(255, 255, 255, 0.3);
    }

    .lang-btn img {
      width: 24px;
      height: 24px;
    }

    .lang-btn:hover {
      background: linear-gradient(135deg, #ff3399, #7a1cf5);
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(255, 255, 255, 0.6);
    }

    .store-buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }

      .store-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 28px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #fff;
      text-decoration: none;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      transition: all 0.3s ease;
      width: 180px;
    }

    .store-btn img {
      width: 28px;
      height: 28px;
    }

    .store-btn:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
      background: rgba(255, 255, 255, 0.25);
    }

    footer {
      position: fixed;
      bottom: 15px;
      left: 0; right: 0;
      font-size: 0.9rem;
      opacity: 0.8;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <img src="refleX_avatar.png" alt="RefleX Logo" class="logo">
  </header>

  <div class="lang-buttons">
    <a href="aboutus-en.html" class="lang-btn">
      <img src="https://flagcdn.com/w20/gb.png" alt="English"> English
    </a>
    <a href="aboutus-tr.html" class="lang-btn">
      <img src="https://flagcdn.com/w20/tr.png" alt="Türkçe"> Türkçe
    </a>
  </div>

  <div class="store-buttons">
    <a href="https://apps.apple.com/us/app/reflex-genius/id6775504797" class="store-btn" target="_blank">
      <img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg" alt="App Store"> App Store
    </a>
    <a href="https://play.google.com/store/" class="store-btn" target="_blank">
      <img src="https://upload.wikimedia.org/wikipedia/commons/d/d0/Google_Play_Arrow_logo.svg" alt="Play Store"> Play Store
    </a>
  </div>

  <footer>
    RefleX © 2026 • All rights reserved • Powered by littleGenius
  </footer>

</body>
</html>
