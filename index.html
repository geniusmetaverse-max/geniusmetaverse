<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>littleGeniusMetaverse</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      font-family: 'Arial', 'Helvetica', sans-serif;
      color: white;
      text-align: center;
    }
    .container {
      max-width: 1000px;
      padding: 40px;
    }
    h1 {
      font-size: 3rem;
      margin: 0 0 20px;
      text-shadow: 0 6px 15px rgba(0,0,0,0.5);
    }
    .apps {
      display: flex;
      justify-content: center;
      gap: 40px;
      flex-wrap: wrap;
      margin-top: 40px;
    }
    .app {
      width: 200px;
      height: 200px;
      border: 3px solid #ffd700;
      border-radius: 20px;
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      background: rgba(255, 215, 0, 0.05);
    }
    .app img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .app:hover {
      transform: translateY(-10px);
      box-shadow: 0 8px 20px rgba(255, 215, 0, 0.3);
    }
    .footer {
      position: absolute;
      bottom: 20px;
      font-size: 1rem;
      opacity: 0.7;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Welcome to littleGenius Metaverse</h1>
    <div class="apps">
      <a href="https://geniusmetaverse-max.github.io/geniusmetaverse/magicmirror/" class="app">
        <img src="Magic Mirror.png" alt="Magic Mirror">
      </a>
      <a href="https://geniusmetaverse-max.github.io/geniusmetaverse/wordlegend/" class="app">
        <img src="Word Legend.png" alt="Word Legend">
      </a>
      <a href="https://geniusmetaverse-max.github.io/geniusmetaverse/reflex/" class="app">
        <img src="Reflex.png" alt="Reflex">
      </a>
    </div>
  </div>

  <div class="footer">
    © 2026 littleGenius Metaverse • All rights reserved
  </div>

</body>
</html>
