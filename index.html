<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>littleGenius Metaverse</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: url("littleGenius.png") no-repeat center center;
      background-size: contain; /* Görselin tamamı görünür */
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      margin-top: 40px;
      font-size: 3vw; /* ekran boyutuna göre ölçeklenir */
      color: white;
      text-shadow: 0 4px 12px rgba(0,0,0,0.7);
    }

    .apps {
      display: flex;
      gap: 3vw;
      margin: auto;
    }

    .app {
      width: 15vw;
      height: 15vw;
      border: 3px solid #ffd700;
      border-radius: 20px;
      overflow: hidden;
      background: rgba(0,0,0,0.4);
      transition: transform 0.3s ease;
    }

    .app img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .app:hover {
      transform: scale(1.1);
    }

    .footer {
      margin-bottom: 20px;
      font-size: 1.2vw;
      color: white;
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <div class="scene">
    <h1>Welcome to littleGenius Metaverse</h1>

    <div class="apps">
      <a href="magicmirror/" class="app">
        <img src="Magic Mirror.png" alt="Magic Mirror">
      </a>
      <a href="wordlegend/" class="app">
        <img src="Word Legend.png" alt="Word Legend">
      </a>
      <a href="reflex/" class="app">
        <img src="Reflex.png" alt="Reflex">
      </a>
    </div>

    <div class="footer">
      © 2026 littleGenius Metaverse • All rights reserved
    </div>
  </div>

</body>
</html>
