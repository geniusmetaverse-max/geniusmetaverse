<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>littleGenius Metaverse</title>
  <style>
    body {
      margin: 0;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .scene-wrapper {
      width: 1920px;   /* tasarım genişliği */
      height: 1080px;  /* tasarım yüksekliği */
      transform: scale(var(--scale));
      transform-origin: top left;
    }

    .scene {
      position: relative;
      width: 100%;
      height: 100%;
      background: url("littleGenius.png") no-repeat center center;
      background-size: cover; /* sahneye tam oturur */
      color: white;
      text-align: center;
      font-family: Arial, sans-serif;
    }

    h1 {
      margin-top: 40px;
      font-size: 64px;
      text-shadow: 0 4px 12px rgba(0,0,0,0.7);
    }

    .apps {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 60px;
    }

    .app {
      width: 200px;
      height: 200px;
      border: 3px solid #ffd700;
      border-radius: 20px;
      overflow: hidden;
      background: rgba(0,0,0,0.4);
    }

    .app img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .footer {
      position: absolute;
      bottom: 30px;
      width: 100%;
      text-align: center;
      font-size: 24px;
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <div class="scene-wrapper">
    <div class="scene">
      <h1>Welcome to littleGenius Metaverse</h1>

      <div class="apps">
        <a href="magicmirror/" class="app">
          <img src="Magic Mirror.png" alt="Magic Mirror">
        </a>
        <a href="wordlegend/" class="app">
          <img src="Word Legend.png" alt="Word Legend">
        </a>
        <a href="reflex/" class="app">
          <img src="Reflex.png" alt="Reflex">
        </a>
      </div>

      <div class="footer">
        © 2026 littleGenius Metaverse • All rights reserved
      </div>
    </div>
  </div>

  <script>
    function resizeScene() {
      const scaleX = window.innerWidth / 1920;
      const scaleY = window.innerHeight / 1080;
      const scale = Math.min(scaleX, scaleY);
      document.documentElement.style.setProperty('--scale', scale);
    }
    window.addEventListener('resize', resizeScene);
    resizeScene();
  </script>

</body>
</html>
